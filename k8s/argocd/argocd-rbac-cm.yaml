apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.csv: |
    # Super-user role: full access to all applications and settings
    g, admin, role:admin

    # Developer role: view all applications, sync dev only
    g, developer, role:developer

    # Admin: full access to all objects and actions
    p, role:admin, applications, *, */*, allow
    p, role:admin, projects, *, */*, allow
    p, role:admin, repositories, *, */*, allow
    p, role:admin, clusters, *, */*, allow
    p, role:admin, accounts, *, */*, allow
    p, role:admin, settings, *, */*, allow
    p, role:admin, keycloak, *, */*, allow
    p, role:admin, action, exec, *, allow

    # Developer: view all applications and resources
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, watch, */*, allow
    p, role:developer, applications, create, */*, allow
    p, role:developer, projects, get, */*, allow
    p, role:developer, projects, watch, */*, allow
    p, role:developer, repositories, get, *, allow
    p, role:developer, clusters, get, *, allow

    # Developer: sync only dev-environment applications (names ending in -dev)
    p, role:developer, applications, sync, dev-*, allow
    p, role:developer, applications, action, resource:action, dev-*, allow

    # Developer: NO prod sync — explicitly deny sync on prod applications
    p, role:developer, applications, sync, prod-*, deny