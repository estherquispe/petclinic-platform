apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  labels:
    app.kubernetes.io/name: api-gateway-hpa
    app.kubernetes.io/part-of: petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  min: 2
  max: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: UtilizationAverage
          averageUtilization: 70