apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genai-service-hpa
  labels:
    app.kubernetes.io/name: genai-service-hpa
    app.kubernetes.io/part-of: petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genai-service
  min: 1
  max: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: UtilizationAverage
          averageUtilization: 70