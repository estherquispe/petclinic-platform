apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: config-server-hpa
  labels:
    app.kubernetes.io/name: config-server-hpa
    app.kubernetes.io/part-of: petclinic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: config-server
  min: 2
  max: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: UtilizationAverage
          averageUtilization: 70