# PETPLAT-55: Prometheus (dev: 7d retention, 10Gi EBS; prod: 15d / 50Gi via overlay)
# Scrape targets: ONLY the 5 services that ship micrometer-registry-prometheus.
# config-server, discovery-server and admin-server are intentionally excluded (404 on /actuator/prometheus).
# NOTE: api-gateway is scraped via its Helm-managed Service port 8080 (helm-values/api-gateway.yaml service.port).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring:9093

    scrape_configs:
      - job_name: api-gateway
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["api-gateway.petclinic-dev:8080"]
      - job_name: customers-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["customers-service.petclinic-dev:8081"]
      - job_name: visits-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["visits-service.petclinic-dev:8082"]
      - job_name: vets-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["vets-service.petclinic-dev:8083"]
      - job_name: genai-service
        metrics_path: /actuator/prometheus
        scrape_interval: 15s
        static_configs:
          - targets: ["genai-service.petclinic-dev:8084"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: petclinic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      protocol: TCP
      port: 9090
      targetPort: 9090
