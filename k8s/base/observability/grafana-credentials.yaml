# Grafana admin credentials via External Secrets (never store secrets in YAML).
# Requires AWS Secrets Manager secret `petclinic/dev/grafana-admin` with keys: username, password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-admin-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: observability
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: petclinic/dev/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: petclinic/dev/grafana-admin
        property: password
  refreshInterval: 1h
