apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-server
  labels:
    app.kubernetes.io/name: admin-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: admin
data:
  application.yml:
    spring:
      application:
        name: admin-server
      cloud:
        config:
          import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
      profiles:
        active: docker
    server:
      port: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-server-env
  labels:
    app.kubernetes.io/name: admin-server-env
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: admin
data:
  CONFIG_SERVER_URL: "http://config-server:8888"