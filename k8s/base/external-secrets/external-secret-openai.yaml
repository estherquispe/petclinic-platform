apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: external-secrets
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
    policy: keep
  target:
    name: openai-api-key
    creationPolicy: Owner
  data:
    - name: OPENAI_API_KEY
      secretKey: api_key
      remoteRef:
        key: petclinic-openai-api-key
        property: api_key
  refreshInterval: 1h