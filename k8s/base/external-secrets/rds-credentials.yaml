apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: rds-credentials
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rds-credentials
    # NOTE (v1 API): target.namespace no longer exists in external-secrets.io/v1.
    # The Kubernetes Secret is created in the same namespace as this ExternalSecret
    # (external-secrets). To materialize it in petclinic-{env}, deploy this
    # ExternalSecret in that namespace instead.
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: petclinic/{env}/rds-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/{env}/rds-credentials
        property: password
  refreshInterval: 1h
