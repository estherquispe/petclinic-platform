apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: openai-api-key
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: petclinic-secrets
    # NOTE (v1 API): target.namespace no longer exists in external-secrets.io/v1.
    # The Kubernetes Secret is created in the same namespace as this ExternalSecret
    # (petclinic-dev), where the genai-service consumes it.
    # Name must match secretKeyRef.name in genai-service deployment
    # (k8s/base/genai-service/deployment.yaml) and secretName in
    # helm-values/genai-service.yaml.
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        # petclinic/dev/openai-api-key is a PLAINTEXT secret (see
        # technical-spec.md → Secrets Management): the whole SecretString is
        # used as the value, so no remoteRef.property is set.
        key: petclinic/dev/openai-api-key
  refreshInterval: 1h
