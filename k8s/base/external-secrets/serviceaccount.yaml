apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    # IRSA (PETPLAT-37): annotated after `terraform apply` with the role ARN
    # exported by the EKS module output `eso_role_arn`
    # (role: petclinic-{env}-eso-role):
    #
    #   ROLE_ARN=$(terraform output -raw eso_role_arn)
    #   kubectl annotate sa external-secrets-sa -n external-secrets \
    #     eks.amazonaws.com/role-arn="${ROLE_ARN}" --overwrite
    eks.amazonaws.com/role-arn: REPLACE_WITH_ESO_IRSA_ROLE_ARN
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: infrastructure
