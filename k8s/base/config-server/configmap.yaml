apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
data:
  application.yml: |
    spring:
      application:
        name: config-server
      cloud:
        config:
          server:
            git:
              uri: https://github.com/spring-petclinic/spring-petclinic-microservices-config
              defaultLabel: main
    server:
      port: 8888
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-server-env
  labels:
    app.kubernetes.io/name: config-server-env
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
data:
  CONFIG_SERVER_URL: "http://config-server:8888"