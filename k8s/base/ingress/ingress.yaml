# Ingress for the API Gateway — PETPLAT-30 (technical-spec.md → DNS and Ingress).
# Routes all external traffic (/) to the api-gateway service on port 8080; the
# gateway itself routes to the backend services. The AWS Load Balancer Controller
# (PETPLAT-29, IngressClass "alb") reconciles this into an internet-facing ALB
# with TLS termination (ACM wildcard cert from the dns module, PETPLAT-28) and an
# HTTP→HTTPS redirect.
#
# NOTE: this manifest carries two environment-specific values (namespace and the
# ACM certificate ARN) — they are patched per environment by the Kustomize
# overlays (k8s/overlays/, E-9). For the dev course environment they are set to
# the petclinic-dev values directly.
#
# Before applying, set the certificate ARN from Terraform (PETPLAT-28/32):
#   terraform -chdir=terraform/environments/dev output -raw dns_certificate_arn
# If the certificate is ever rotated (create_before_destroy issues a new ARN),
# re-sync the live Ingress without editing this file:
#   kubectl -n petclinic-dev annotate ingress api-gateway \
#     alb.ingress.kubernetes.io/certificate-arn="$(terraform -chdir=terraform/environments/dev output -raw dns_certificate_arn)" --overwrite
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: petclinic-dev
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: backend
  annotations:
    # technical-spec.md → Ingress Resource Annotations.
    # kubernetes.io/ingress.class is deprecated in networking.k8s.io/v1 but kept
    # here because the technical spec requires it; spec.ingressClassName below
    # is the non-deprecated equivalent and both agree on "alb".
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Wildcard ACM certificate created and DNS-validated by the dns module —
    # REPLACE with the value of the terraform output dns_certificate_arn.
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:409297710841:certificate/7d6c213b-19f2-4dc3-a617-b20782aa37a0"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # HTTP (80) redirects to HTTPS (443) — PETPLAT-31: "HTTP redirects to HTTPS".
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    # NOTE (security review): the ALB's security groups are created and managed
    # by the AWS Load Balancer Controller (internet-facing 80/443 + a managed
    # target SG). The Terraform ALB SG (module.vpc.alb_sg_id) is therefore NOT
    # attached to this ALB and is not its perimeter. Attaching it via
    # alb.ingress.kubernetes.io/security-groups would add nothing — SG egress
    # and ingress rules across multiple attached SGs are unioned (OR), so the
    # controller-managed allow rules always win. If Terraform-owned SGs are
    # ever required, also set manage-security-groups: "false" and open the
    # pod-8080 path on the node SG explicitly.
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080