apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-service
  labels:
    app.kubernetes.io/name: genai-service
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
data:
  application.yml:
    spring:
      application:
        name: genai-service
      cloud:
        config:
          import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
      profiles:
        active: docker,production
    server:
      port: 8084
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-service-env
  labels:
    app.kubernetes.io/name: genai-service-env
    app.kubernetes.io/part-of: petclinic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: service
data:
  CONFIG_SERVER_URL: "http://config-server:8888"