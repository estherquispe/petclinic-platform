apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "petclinic.fullname" . }}-config
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
data:
  application.yml:
    spring:
      application:
        name: {{ include "petclinic.fullname" . }}
      cloud:
        config:
          import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
      profiles:
        active: {{ .Values.springProfiles | default "docker" }}
    server:
      port: {{ .Values.service.port }}