nameOverride: genai-service
app:
  component: service
image:
  name: genai-service
  tag: "v1.0.1"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
    restartPolicy: Never
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
    restartPolicy: Never
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  port: 8084
springProfiles: docker,production
env:
  - name: SPRING_APPLICATION_NAME
    value: genai-service
secrets:
  - name: OPENAI_API_KEY
    secretName: petclinic-secrets
    key: OPENAI_API_KEY
hpa:
  enabled: true
  min: 1
  max: 3
  cpuUtilization: 70
notes:
  content: Post-installation notes for genai-service
  enabled: true
