nameOverride: customers-service
app:
  component: service
image:
  name: customers-service
  tag: "v1.0.0"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
    restartPolicy: Never
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
    restartPolicy: Never
replicaCount: 2
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  port: 8081
springProfiles: docker,mysql
env:
  - name: SPRING_APPLICATION_NAME
    value: customers-service
  - name: SPRING_DATASOURCE_URL
    value: jdbc:mysql://petclinic-db:3306/petclinic
secrets:
  - name: SPRING_DATASOURCE_USERNAME
    secretName: rds-credentials
    key: username
  - name: SPRING_DATASOURCE_PASSWORD
    secretName: rds-credentials
    key: password
hpa:
  enabled: true
  min: 2
  max: 4
  cpuUtilization: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
notes:
  content: Post-installation notes for customers-service
  enabled: true
