app:
  component: customers-service
env:
- name: SPRING_DATASOURCE_URL
  value: jdbc:mysql://petclinic-db:3306/petclinic
- name: SPRING_DATASOURCE_USERNAME
  valueFrom:
    secretKeyRef:
      key: username
      name: petclinic-db-credentials
- name: SPRING_DATASOURCE_PASSWORD
  valueFrom:
    secretKeyRef:
      key: password
      name: petclinic-db-credentials
image:
  name: customers-service
  tag: ={{ .Chart.AppVersion }}
initContainers:
- command:
  - sh
  - -c
  - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
  image: busybox:1.36
  name: wait-for-config-server
- command:
  - sh
  - -c
  - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
  image: busybox:1.36
  name: wait-for-discovery-server
notes:
  content: Post-installation notes for customers-service
  enabled: true
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
secrets:
- key: username
  name: SPRING_DATASOURCE_USERNAME
  secretName: petclinic-db-credentials
- key: password
  name: SPRING_DATASOURCE_PASSWORD
  secretName: petclinic-db-credentials
service:
  port: 8081
spring:
  startupProbe:
    failureThreshold: 30
    initialDelaySeconds: 0
springProfiles: docker,mysql
