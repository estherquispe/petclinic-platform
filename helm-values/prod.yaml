# Prod environment overrides.
# Applied after per-service values. Prod image registry is set here.
# Per-service replica counts, HPA targets and PDB settings live in
# helm-values/{service}.yaml to match k8s/overlays/prod exactly (no blanket
# defaults; e.g. admin-server has no HPA/PDB, genai-service has no PDB).
image:
  registry: 533267262133.dkr.ecr.us-east-1.amazonaws.com/petclinic-prod
  pullSecrets:
    - name: ecr-pull-secret
