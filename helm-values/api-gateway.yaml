nameOverride: api-gateway
app:
  component: service
image:
  name: api-gateway
  tag: "v1.0.0"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
    restartPolicy: Never
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
    restartPolicy: Never
replicaCount: 2
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
service:
  port: 8080
probes:
  startup:
    initialDelaySeconds: 90
    failureThreshold: 12
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1
springProfiles: docker
env:
  - name: DISCOVERY_SERVER_URL
    value: http://discovery-server:8761
secrets: []
hpa:
  enabled: true
  min: 2
  max: 6
  cpuUtilization: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
notes:
  content: Post-installation notes for api-gateway
  enabled: true
