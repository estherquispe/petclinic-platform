app:
  component: api-gateway
image:
  name: api-gateway
  tag: ={{ .Chart.AppVersion }}
initContainers:
- command:
  - sh
  - -c
  - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
  image: busybox:1.36
  name: wait-for-config-server
- command:
  - sh
  - -c
  - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
  image: busybox:1.36
  name: wait-for-discovery-server
notes:
  content: Post-installation notes for api-gateway
  enabled: true
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
service:
  port: 8080
spring:
  startupProbe:
    failureThreshold: 30
    initialDelaySeconds: 0
springProfiles: docker
