nameOverride: admin-server
app:
  component: admin
image:
  name: admin-server
  tag: "v1.0.0"
initContainers:
  - name: wait-for-config-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://config-server:8888/actuator/health; do sleep 5; done
    restartPolicy: Never
  - name: wait-for-discovery-server
    image: busybox:1.36
    command:
      - sh
      - -c
      - until wget -qO- http://discovery-server:8761/actuator/health; do sleep 5; done
    restartPolicy: Never
replicaCount: 1
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
service:
  port: 9090
springProfiles: docker
env:
  - name: SPRING_APPLICATION_NAME
    value: admin-server
secrets: []
notes:
  content: Post-installation notes for admin-server
  enabled: true
