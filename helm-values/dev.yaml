# Dev environment overrides.
# Applied after per-service values. Dev runs 1 replica per service with HPA
# and PDB disabled.
image:
  registry: 409297710841.dkr.ecr.us-east-1.amazonaws.com/petclinic-dev
  # No pull secret: EKS nodes pull from same-account ECR via the node IAM role
  # (AmazonEC2ContainerRegistryReadOnly).
  pullSecrets: []
replicaCount: 1
hpa:
  enabled: false
podDisruptionBudget:
  enabled: false
